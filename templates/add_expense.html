{% extends 'base.html' %}

{% block content %}
<!-- Full-page background container -->
<div style="
    min-height: 100vh;
    background: url('/static/images/background.jpg') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
">

    <!-- Add Expense Card -->
    <div style="
        width: 100%;
        max-width: 500px;
        background: rgba(0,0,0,0.75);
        padding: 30px 25px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        backdrop-filter: blur(5px);
        color: #fff;
        display: flex;
        flex-direction: column;
        gap: 15px;
        transition: transform 0.3s;
    " onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">

        <h2 style="text-align:center; margin-bottom:15px;">Add Allowance / Funds</h2>
        <p style="text-align:center; color:#ccc; margin-bottom:20px;">
            Allocate funds for your child and track weekly, monthly, or yearly allowances.
        </p>

        <form method="post" style="display:flex; flex-direction:column; gap:12px;">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" style="
                padding: 12px;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 16px;
                cursor: pointer;
                transition: background 0.3s;
            " onmouseover="this.style.backgroundColor='#1e7e34'" onmouseout="this.style.backgroundColor='#28a745'">
                Add Allowance
            </button>
        </form>
    </div>
</div>
{% endblock %}
