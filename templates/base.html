<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Vault{% endblock %}</title>
    
    {% load static %}

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Your custom CSS (optional) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="text-light position-relative">

    <div class="position-fixed top-0 start-0 w-100 h-100"
         style="z-index: -2;
                background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.40)),
                            url('{% static 'images/bgs.jpg' %}') 
                            center / cover no-repeat fixed;">
    </div>

    <!-- Very subtle extra overlay (optional - comment out if not needed) -->
    <!-- <div class="position-fixed top-0 start-0 w-100 h-100"
         style="z-index: -1;
                background: linear-gradient(to bottom, rgba(0,0,0,0.08), rgba(0,0,0,0.20));">
    </div> -->

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top"
         style="background-color: rgba(0,0,0,0.50); backdrop-filter: blur(8px); z-index: 1000;">
        <div class="container-fluid px-4 px-md-5">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'landing' %}">
                <img src="{% static 'images/E.V.png' %}" alt="Expense Vault" 
                     style="width: 44px; height: 44px; margin-right: 12px; border-radius: 8px;">
                <span class="fw-bold fs-3 text-danger">Expense Vault</span>
            </a>

            <div class="ms-auto">
                {% if user.is_authenticated %}
                    <span class="me-3">Hi, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light me-2 btn-sm">Sign In</a>
                    <a href="{% url 'signup' %}" class="btn btn-danger btn-sm">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="pt-5 position-relative" style="z-index: 10; min-height: 90vh;">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-black text-muted py-4 mt-5"
            style="background-color: rgba(0,0,0,0.70); z-index: 10;">
        <div class="container text-center">
            <p class="mb-0">© 2026 Expense Vault</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
