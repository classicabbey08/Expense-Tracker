{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Vault</title>
    <link rel="icon" type="image/png" href="{% static 'images/fav for ev.png' %}">
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #141414;
            color: #fff;
        }
        a { text-decoration: none; color: inherit; }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: #000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .navbar .logo img { height:40px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #fff; padding: 8px 12px; border-radius: 4px; transition: background 0.3s; }
        .nav-links a:hover { background-color: #e50914; color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .btn {
            display: inline-block; padding: 10px 20px; border-radius: 6px;
            border: none; cursor: pointer; font-size: 1rem; transition: background 0.3s;
        }
        .btn-primary { background-color: #e50914; color: #fff; }
        .btn-primary:hover { background-color: #b00610; }
        .btn-success { background-color: #28a745; color: #fff; }
        .btn-success:hover { background-color: #1e7e34; }
        .btn-warning { background-color: #ffc107; color: #000; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-danger { background-color: #dc3545; color: #fff; }
        .btn-danger:hover { background-color: #c82333; }

        h1,h2,h3 { margin: 0 0 10px 0; }
        p { margin: 0 0 10px 0; }

        footer { text-align:center; padding:20px; background-color:#000; color:#ccc; margin-top:40px; }

        @media (max-width:768px){
            .navbar { flex-direction: column; align-items: flex-start; gap: 10px; }
            .nav-links { flex-direction: column; width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="{% url 'landing' %}"><img src="{% static 'images/E.V.png' %}" alt="Expense Vault"></a>
        </div>
        <div class="nav-links">
            <a href="{% url 'landing' %}">Home</a>
            {% if user.is_authenticated %}
                <a href="{% url 'expense_list' %}">Dashboard</a>
                <a href="{% url 'add_expense' %}">Add Allowance</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <!-- Main content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>&copy; {{ year|default:"2026" }} Expense Vault. All rights reserved.</footer>
</body>
</html>
