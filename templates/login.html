{% extends 'base.html' %}
{% block title %}Sign In - Expense Vault{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin-top: 120px;">
    <div class="card bg-dark text-white border-0 shadow-lg p-4">
        <h2 class="text-center mb-4">Sign In</h2>
        
        {% if form.errors %}
            <div class="alert alert-danger">
                Invalid email or password. Try again.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label">Email or Username</label>
                {{ form.username }}
            </div>
            
            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-danger w-100 py-2 fs-5">Sign In</button>
        </form>

        <div class="text-center mt-4">
            <p>New to Expense Vault? <a href="{% url 'signup' %}" class="text-danger">Sign up now</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
