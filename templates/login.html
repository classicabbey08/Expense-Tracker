{% extends 'base.html' %}

{% block content %}
<div style="min-height:100vh; display:grid; place-items:center; background:#000; color:white;">
    <div style="width:100%; max-width:420px; padding:40px; background:rgba(0,0,0,0.75); border-radius:8px; text-align:center;">
        <h1 style="margin-bottom:20px;">Parent Login</h1>
        <p style="color:#ccc; margin-bottom:30px;">
            Sign in to manage your children's allowances and track funds.
        </p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width:100%; padding:14px; background:#e50914; color:white; border:none; border-radius:4px; font-size:16px; cursor:pointer; margin-top:10px;">
                Login & Track Allowances
            </button>
        </form>
        <p style="margin-top:20px;">
            Don't have an account? <a href="{% url 'signup' %}" style="color:#e50914;">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
