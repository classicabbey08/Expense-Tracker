{% extends 'base.html' %}
{% block title %}Sign Up - Expense Vault{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin-top: 120px;">
    <div class="card bg-dark text-white border-0 shadow-lg p-4">
        <h2 class="text-center mb-4">Create Account</h2>

        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-danger w-100 py-2 fs-5">Sign Up</button>
        </form>

        <div class="text-center mt-4">
            <p>Already have an account? <a href="{% url 'login' %}" class="text-danger">Sign in</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
