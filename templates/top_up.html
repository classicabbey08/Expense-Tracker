{% extends 'base.html' %}

{% block content %}
<div class="dashboard-container">
    <h2>Top Up Balance for {{ child.user.username }}</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Add Money</button>
    </form>

    <p><a href="{% url 'parent_dashboard' %}">Back to Dashboard</a></p>
</div>
{% endblock %}

<style>
.dashboard-container {
    max-width: 500px;
    margin: 40px auto;
    padding: 20px;
    font-family: Arial, sans-serif;
    border: 1px solid #ddd;
    border-radius: 10px;
}
button.btn {
    padding: 8px 15px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button.btn:hover {
    background-color: #45a049;
}
</style>
